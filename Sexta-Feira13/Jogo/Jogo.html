<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Noite de Pânico</title>
    <link rel="stylesheet" href="Jogo.css" />
    
</head>
<body>
    <div id="game-container">
        <div id="background"></div>
        <div id="vignette"></div>

        <div id="call-banner">   CHAMADA DE <span id="call-label">NÚMERO DESCONHECIDO</span></div>

        <div id="text-box">
            <div id="character-name"></div>
            <p id="dialogue-text"></p>
        </div>

        <div id="dado-resultado" class="dado-resultado"></div>

        <div id="options-container"></div>

        <div id="status-container">
            <div id="inventario">Itens: (nenhum)</div>
            <div id="escolhas">Registro: (vazio)</div>
        </div>
    </div>

    <script src="Jogo.js"></script>
</body>
</html>
