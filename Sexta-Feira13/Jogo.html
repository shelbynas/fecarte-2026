<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Noite de Pânico</title>
    <link rel="stylesheet" href="Jogo.css" />
</head>
<body>
    <div id="game-container">
        <div id="background"></div>

        <!-- Efeito real de estática cobrindo o fundo do jogo -->
        <div id="static-overlay"></div>

        <div id="vignette"></div>

        <!-- Banner do topo: só aparece durante uma ligação -->
        <div id="top-banner"></div>

        <button id="tab-itens" class="corner-tab left"> Itens</button>
        <button id="tab-finais" class="corner-tab right"> Finais: 0/8</button>

        <div id="main-area">
            <div id="npc-portrait">
                <img id="npc-portrait-img" alt="Duda">
            </div>
            <div id="options-container"></div>
        </div>

        <div id="name-tag"></div>

        <div id="text-box">
            <p id="dialogue-text"></p>
        </div>

        <div id="phone-corner-icon">
            <svg viewBox="0 0 64 64"><path d="M20 12c-4 0-6 2-6 6 0 16 12 32 28 32 4 0 6-2 6-6l-2-8-10 4c-6-4-10-10-12-16l4-10-8-2z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg>
        </div>

        <button id="audio-toggle" title="Ligar/desligar a trilha sonora">🔊</button>
        <audio id="bg-music" src="IAmDeskDeathandTaxes7.mp3" loop preload="auto"></audio>

        <div id="dado-resultado" class="dado-resultado"></div>

        <div id="itens-overlay" class="overlay hidden">
            <div class="overlay-panel">
                <h2>Itens</h2>
                <div id="itens-list"></div>
                <button class="close-overlay" data-target="itens-overlay">Fechar</button>
            </div>
        </div>

        <div id="endings-overlay" class="overlay hidden">
            <div class="overlay-panel">
                <h2>Finais descobertos</h2>
                <div id="endings-list"></div>
                <button class="close-overlay" data-target="endings-overlay">Fechar</button>
            </div>
        </div>
    </div>

    <script src="Jogo.js"></script>
</body>
</html>
