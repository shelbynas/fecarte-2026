<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>JOGOS MORTAIS</title>
</head>

<body>

    <div class="vinheta"></div>
    <video src="imagens/estatica.mp4" class="estatica"></video>

    <main id="interface" class="tv">

        <div class="tv-antena"></div>
        <div class="tv-tela">
            <div class="tela-conteudo">

                <section id="inicio" class="tela-cena">
                    <h1>JOGOS<br>MORTAIS</h1>
                    <div class="linha-sinal"></div>
                    <p class="instrucao">Antes de começarmos, diga seu nome.</p>
                    <input id="nome" type="text" maxlength="20" autocomplete="off" placeholder="SEU NOME">
                    <button id="comecar" class="botao" type="button">CONTINUAR</button>
                </section>

                <section id="menu" class="tela-cena escondida">
                    <h1>ARQUIVO 01</h1>
                    <p class="subtitulo">Uma história sobre escolhas, culpa e consequências.</p>

                    <div class="painel-menu">
                        <div><span>SUJEITO</span>
                            <p id="nomeMenu">---</p>
                        </div>
                        <div><span>ARQUIVO</span>
                            <p>01</p>
                        </div>
                        <div><span>STATUS</span>
                            <p>INCOMPLETO</p>
                        </div>
                    </div>

                    <div class="menu-botoes">
                        <button id="iniciarHistoria" class="botao botao-principal" type="button">INICIAR
                            HISTÓRIA</button>
                    </div>
                </section>

                <section id="jogo" class="tela-cena escondida">

                    <div class="cenario-banheiro">
                        <div class="azulejos"></div>

                        <div class="luminaria">
                            <span></span>
                        </div>

                        <div class="tubulacao">
                            <span></span><span></span>
                        </div>

                        <div class="espelho-quebrado">
                        </div>

                        <div class="pia">
                            <div class="pia-torneira"></div>
                            <div class="pia-bacia"></div>
                        </div>

                        <div class="canos-chao">
                            <span></span><span></span>
                        </div>

                        <div class="bancada">
                        </div>

                        <div class="ralo">
                            <i></i>
                        </div>

                        <div class="chao"></div>
                        <div class="luz-vermelha"></div>
                        <div class="sombra-porta"></div>
                    </div>

                    <div class="camera-seguranca">● REC</div>

                    <div class="cabecalho-jogo">
                        <p id="capitulo">ARQUIVO 01</p>
                        <div class="timer-interface">
                            <span class="timer-label">TEMPO</span>
                            <span id="timerJogo">02:00</span>
                        </div>
                    </div>

                    <div class="identificacao-cena">
                        <span>LOCAL // DESCONHECIDO</span>
                        <i></i>
                        <span id="statusCena">SINAL ESTÁVEL</span>
                    </div>

                    <div id="tituloCena"></div>

                    <div id="areaHistoria" class="area-historia">
                        <div class="dialogo-meta">
                            <span>NARRADOR</span>
                            <span id="indicadorMensagem">01</span>
                        </div>
                        <p id="texto"></p>
                        <button id="avancar" class="botao-avancar" type="button" aria-label="Avançar">▶</button>
                    </div>

                    <div id="escolhas" class="escolhas"></div>

                    <div id="final" class="final escondida">
                        <div class="selo-final">FIM DO ARQUIVO</div>
                        <div class="linha-final"></div>
                        <p id="finalTexto"></p>
                        <button id="reiniciarFinal" class="botao botao-principal" type="button">REINICIAR</button>
                    </div>
                </section>
            </div>
        </div>

        <div class="tv-controles">
            <button>⏮</button>
            <button id="play">▶</button>
            <button>⏭</button>
            <button>♬</button>
        </div>
        <div class="tv-led"></div>
    </main>

</body>

</html>
